<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">InPlace brand board 3 by 3</title>
  <desc id="board-desc">Nine-panel identity board for InPlace using the Place Bay logo, petrol and warm paper palette, typography, shape language, and product applications.</desc>
  <defs>
    <style>
      .latin { font-family: "Segoe UI", Arial, sans-serif; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.4px; fill: #0f5a66; }
      .caption { font-size: 16px; font-weight: 400; fill: #53666a; }
      .ink { fill: #0e1f22; }
      .petrol { fill: #073942; }
      .action { fill: #0f5a66; }
      .line { stroke: #d9d5ca; stroke-width: 2; }
      .panel { fill: #fefcf9; }
      .mark { fill: none; stroke: currentColor; stroke-width: 7; stroke-linecap: butt; stroke-linejoin: miter; }
    </style>
    <pattern id="construction-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0f5a66" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <g id="place-bay">
      <path class="mark" d="M11.5 8V52.5H56"/>
      <rect x="20" y="20" width="24" height="24" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#052f36"/>

  <!-- 01 Logo cover -->
  <rect x="40" y="40" width="493" height="360" rx="10" fill="#073942" stroke="#0f5a66" stroke-width="2"/>
  <use href="#place-bay" transform="translate(90 138) scale(1.75)" color="#f7f4ed"/>
  <text x="212" y="215" class="latin" fill="#f7f4ed" font-size="58" font-weight="600" letter-spacing="-1.5">InPlace</text>
  <text x="72" y="345" class="latin" fill="#f7f4ed" font-size="16" font-weight="700" letter-spacing="1.4">01  PRIMARY LOGO</text>
  <text x="72" y="373" class="latin" fill="#c7d6d2" font-size="16">Place Bay</text>

  <!-- 02 Construction -->
  <rect class="panel" x="553" y="40" width="493" height="360" rx="10"/>
  <rect x="588" y="74" width="220" height="220" rx="8" fill="url(#construction-grid)"/>
  <path d="M588 184h220M698 74v220" stroke="#0f5a66" stroke-opacity="0.32" stroke-width="1.5"/>
  <use href="#place-bay" transform="translate(640 126) scale(1.8)" color="#073942"/>
  <text x="835" y="155" class="latin ink" font-size="31" font-weight="600">One place.</text>
  <text x="835" y="195" class="latin ink" font-size="31" font-weight="600">One block.</text>
  <text x="835" y="235" class="latin action" font-size="31" font-weight="600">In place.</text>
  <text x="585" y="345" class="latin label">02  CONSTRUCTION</text>
  <text x="585" y="373" class="latin caption">A defined place, and the one thing in it</text>

  <!-- 03 Monochrome and reduction -->
  <rect class="panel" x="1066" y="40" width="494" height="360" rx="10"/>
  <use href="#place-bay" transform="translate(1105 98) scale(1.55)" color="#0e1f22"/>
  <text x="1215" y="163" class="latin ink" font-size="42" font-weight="600">InPlace</text>
  <line x1="1108" y1="215" x2="1518" y2="215" class="line"/>
  <use href="#place-bay" transform="translate(1120 246) scale(.75)" color="#073942"/>
  <text x="1144" y="316" text-anchor="middle" class="latin caption">48px</text>
  <use href="#place-bay" transform="translate(1280 270) scale(.375)" color="#073942"/>
  <text x="1292" y="316" text-anchor="middle" class="latin caption">24px</text>
  <use href="#place-bay" transform="translate(1415 278) scale(.25)" color="#073942"/>
  <text x="1423" y="316" text-anchor="middle" class="latin caption">16px</text>
  <text x="1098" y="345" class="latin label">03  REDUCTION</text>
  <text x="1098" y="373" class="latin caption">One-color clarity at every size</text>

  <!-- 04 Color -->
  <rect class="panel" x="40" y="420" width="493" height="360" rx="10"/>
  <rect x="72" y="470" width="78" height="140" rx="5" fill="#073942"/>
  <rect x="160" y="470" width="78" height="140" rx="5" fill="#0f5a66"/>
  <rect x="248" y="470" width="78" height="140" rx="5" fill="#f7f4ed" stroke="#d9d5ca"/>
  <rect x="336" y="470" width="78" height="140" rx="5" fill="#fefcf9" stroke="#d9d5ca"/>
  <rect x="424" y="470" width="78" height="140" rx="5" fill="#0e1f22"/>
  <text x="111" y="637" text-anchor="middle" class="latin ink" font-size="14" font-weight="600">Shell</text>
  <text x="111" y="658" text-anchor="middle" class="latin caption" font-size="13">#073942</text>
  <text x="199" y="637" text-anchor="middle" class="latin ink" font-size="14" font-weight="600">Action</text>
  <text x="199" y="658" text-anchor="middle" class="latin caption" font-size="13">#0F5A66</text>
  <text x="287" y="637" text-anchor="middle" class="latin ink" font-size="14" font-weight="600">Paper</text>
  <text x="287" y="658" text-anchor="middle" class="latin caption" font-size="13">#F7F4ED</text>
  <text x="375" y="637" text-anchor="middle" class="latin ink" font-size="14" font-weight="600">Surface</text>
  <text x="375" y="658" text-anchor="middle" class="latin caption" font-size="13">#FEFCF9</text>
  <text x="463" y="637" text-anchor="middle" class="latin ink" font-size="14" font-weight="600">Ink</text>
  <text x="463" y="658" text-anchor="middle" class="latin caption" font-size="13">#0E1F22</text>
  <text x="72" y="725" class="latin label">04  COLOR SYSTEM</text>
  <text x="72" y="753" class="latin caption">Petrol builds trust; status colors keep meaning</text>

  <!-- 05 Typography -->
  <rect class="panel" x="553" y="420" width="493" height="360" rx="10"/>
  <text x="590" y="560" class="latin petrol" font-size="128" font-weight="600" letter-spacing="-5">Aa</text>
  <text x="790" y="500" class="latin petrol" font-size="31" font-weight="600">Manrope</text>
  <text x="790" y="535" class="latin caption">Wordmark · SemiBold</text>
  <text x="790" y="590" class="latin ink" font-size="23">Calm control.</text>
  <text x="790" y="623" class="latin ink" font-size="23">Clear decision.</text>
  <text x="790" y="660" class="latin ink" font-size="22">0123456789 — ₪</text>
  <text x="585" y="725" class="latin label">05  TYPOGRAPHY</text>
  <text x="585" y="753" class="latin caption">Almoni Neue / Noto Sans Hebrew in product</text>

  <!-- 06 Shape language -->
  <rect class="panel" x="1066" y="420" width="494" height="360" rx="10"/>
  <text x="1194" y="482" class="latin action" font-size="15" font-weight="700" text-anchor="end">PLACE BAY</text>
  <path d="M1119 520V595H1194" fill="none" stroke="#0f5a66" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter"/>
  <text x="1345" y="482" class="latin action" font-size="15" font-weight="700" text-anchor="end">ONE BLOCK</text>
  <rect x="1285" y="540" width="40" height="40" fill="#0f5a66"/>
  <text x="1518" y="482" class="latin action" font-size="15" font-weight="700" text-anchor="end">SEATED</text>
  <path d="M1440 520V595H1515" fill="none" stroke="#cfd8d6" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter"/>
  <rect x="1453" y="542" width="40" height="40" fill="#073942"/>
  <text x="1098" y="725" class="latin label">06  SHAPE LANGUAGE</text>
  <text x="1098" y="753" class="latin caption">A defined place · one block · even clearance</text>

  <!-- 07 Product UI -->
  <rect class="panel" x="40" y="800" width="493" height="360" rx="10"/>
  <rect x="72" y="842" width="429" height="230" rx="10" fill="#f7f4ed" stroke="#d9d5ca" stroke-width="2"/>
  <text x="470" y="882" class="latin ink" font-size="19" font-weight="600" text-anchor="end">Needs attention</text>
  <text x="104" y="882" class="latin action" font-size="15" font-weight="600">InPlace</text>
  <line x1="94" y1="902" x2="479" y2="902" class="line"/>
  <g class="latin" font-size="15" fill="#26383b">
    <text x="459" y="938" text-anchor="end">Invoice waiting for approval</text>
    <text x="459" y="980" text-anchor="end">Price variance from order</text>
    <text x="459" y="1022" text-anchor="end">Reconciliation complete</text>
  </g>
  <circle cx="116" cy="932" r="6" fill="#b7791f"/><circle cx="116" cy="974" r="6" fill="#be123c"/><circle cx="116" cy="1016" r="6" fill="#047857"/>
  <rect x="150" y="915" width="104" height="28" rx="7" fill="#0f5a66"/>
  <text x="202" y="935" class="latin" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">REVIEW</text>
  <text x="72" y="1105" class="latin label">07  PRODUCT SURFACE</text>
  <text x="72" y="1133" class="latin caption">One clear next action; status keeps its meaning</text>

  <!-- 08 Applications -->
  <rect class="panel" x="553" y="800" width="493" height="360" rx="10"/>
  <rect x="593" y="860" width="285" height="175" rx="9" fill="#f7f4ed" stroke="#0e1f22" stroke-width="8"/>
  <rect x="593" y="860" width="58" height="175" rx="5" fill="#073942"/>
  <use href="#place-bay" transform="translate(605 874) scale(.5)" color="#f7f4ed"/>
  <rect x="676" y="895" width="166" height="18" rx="5" fill="#dbe3df"/>
  <rect x="676" y="929" width="76" height="76" rx="9" fill="#fefcf9" stroke="#d9d5ca"/>
  <rect x="766" y="929" width="76" height="76" rx="9" fill="#fefcf9" stroke="#d9d5ca"/>
  <rect x="897" y="830" width="108" height="225" rx="22" fill="#073942" stroke="#0e1f22" stroke-width="6"/>
  <rect x="905" y="848" width="92" height="189" rx="14" fill="#f7f4ed"/>
  <use href="#place-bay" transform="translate(915 861) scale(.45)" color="#073942"/>
  <rect x="918" y="908" width="66" height="12" rx="4" fill="#cfd8d6"/>
  <rect x="918" y="934" width="66" height="35" rx="7" fill="#fefcf9" stroke="#d9d5ca"/>
  <rect x="918" y="980" width="66" height="35" rx="7" fill="#fefcf9" stroke="#d9d5ca"/>
  <text x="585" y="1105" class="latin label">08  APPLICATION</text>
  <text x="585" y="1133" class="latin caption">Desktop and mobile share one identity</text>

  <!-- 09 Essence and rules -->
  <rect class="panel" x="1066" y="800" width="494" height="360" rx="10"/>
  <text x="1518" y="875" class="latin petrol" font-size="34" font-weight="600" text-anchor="end">Everything in place.</text>
  <text x="1518" y="920" class="latin action" font-size="34" font-weight="600" text-anchor="end">Clear next step.</text>
  <line x1="1098" y1="950" x2="1518" y2="950" class="line"/>
  <g class="latin" font-size="17" fill="#26383b">
    <text x="1518" y="990" text-anchor="end">Monochrome logo only.</text>
    <text x="1518" y="1022" text-anchor="end">Status colors retain business meaning.</text>
    <text x="1518" y="1054" text-anchor="end">Spacing and order create the premium feel.</text>
  </g>
  <text x="1098" y="1105" class="latin label">09  USAGE &amp; ESSENCE</text>
  <text x="1098" y="1133" class="latin caption">Consistent · clear · trustworthy</text>
</svg>
