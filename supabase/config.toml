project_id = "supplyflow-p0"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 55433

[inbucket]
enabled = false
port = 55434

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5199"
# The quality preview uses the canonical local port 5199. Local GoTrue treats redirect ports as
# exact, and the pinned CLI loads only the first entry here, so keep this list deliberately singular.
# Production needs the mirror ({origin}/reset-password) in the remote Auth URL configuration (#114).
additional_redirect_urls = [
  "http://127.0.0.1:5199/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Google sign-up for the OWNER of a new organization (OPEN-DECISIONS #265, 24.08.2026).
# Disabled unless the two secrets are present, so a checkout without them behaves exactly as
# before. "Owner only" is NOT enforced here -- enabling a provider makes /auth/v1/authorize
# reachable by anyone. It is enforced where standing is granted: 0205 makes accept_invitation
# refuse a federated caller, and public-signup's Google branch only ever creates an owner of a
# NEW organization and refuses a caller that already has a profile.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple sign-up, same rule and the same two server-side enforcement points (owner decision
# 25.08.2026). It needed no migration: 0205's guard refuses every identity whose provider is not
# 'email', which was already true of Apple the day it was written.
#
# Disabled, and not for the usual reason. Apple requires an Apple Developer Program membership
# before a Service ID or a signing key can exist at all, and the project has none -- so unlike
# Google, this provider has never been exercised end to end. `client_id` is the SERVICE ID (not the
# App ID), and `secret` is an ES256 JWT that Supabase mints from the .p8 key and which Apple
# expires after six months, so this one carries a rotation obligation Google does not.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55483

# The anonymous signup door (0159). verify_jwt = false because there IS no caller to
# authenticate: its safety is a database-counted rate limit, a payload nothing tenant-shaped can
# be read from, and an unconfirmed owner account.
[functions.public-signup]
verify_jwt = false

[functions.document-processing]
verify_jwt = false

[functions.document-preprocessing]
verify_jwt = false

# Browser JWTs are validated inside the handler; cron uses a separate narrow shared secret.
[functions.interpret-document]
verify_jwt = false

[functions.recover-document-processing]
verify_jwt = true

[functions.submit-price-list]
verify_jwt = true

[functions.product-name-repair]
verify_jwt = true

[functions.upload-organization-logo]
verify_jwt = true

[functions.tenant-export]
# POST validates the caller JWT inside the handler; GET is a hashed, revocable seven-day
# export token and therefore cannot require an Authorization header.
verify_jwt = false

[functions.send-push]
verify_jwt = false

# Cron-invoked via pg_net (0064 dispatcher); auth is the constant-time shared secret in
# x-outbox-cron-secret, not a JWT — the send-push precedent.
[functions.outbox-worker]
verify_jwt = false

# The assistant boundary. Every other function here that sets verify_jwt = false has a concrete
# reason for it — an anonymous door with no caller, an external worker holding a shared secret, or a
# hashed export token on a GET. The assistant has none of those: its only caller is a signed-in
# browser. So the platform gate rejects an unauthenticated request before the handler runs, and the
# handler's own identity resolution stays as defence in depth rather than as the only check.
[functions.assistant]
verify_jwt = true

# The supplier order portal has no user and no JWT by design: the credential is a hashed,
# revocable, expiring per-order token (0167), the tenant-export shape. POST-only.
[functions.supplier-portal]
verify_jwt = false

# Caller-initiated order delivery (0168): the browser's JWT is forwarded to
# claim_email_order_message, which is the security boundary.
[functions.email-sender]
verify_jwt = true

# The signed Resend delivery webhook (0190). verify_jwt = false because there is no caller to
# authenticate: Resend signs each delivery with Svix, and the HMAC over the raw request body --
# not a JWT -- is the security boundary, the same argument outbox-worker and send-push already
# make for a machine caller holding a shared secret. A bad or missing signature answers 403
# before the body is parsed, and the recording RPC is service-role-only.
[functions.email-webhook]
verify_jwt = false

# Caller-initiated WhatsApp order delivery (0191): the browser's JWT is forwarded to
# claim_whatsapp_order_message, which is the security boundary -- the email-sender precedent.
[functions.whatsapp-sender]
verify_jwt = true

# The provider is not a user of this system and cannot present a JWT. The credential is the
# request signature: HMAC-SHA1 over the callback URL and the sorted POST parameters, keyed by
# that tenant's own Vault token and verified inside the handler -- the supplier-portal shape.
[functions.whatsapp-webhook]
verify_jwt = false

# The billing provider webhook has no user and no JWT by design (0187): the credential is Paddle's
# HMAC-SHA256 signature over the raw request body, verified inside the handler against the endpoint
# secret. Requiring an Authorization header would reject every genuine delivery and secure nothing.
[functions.billing-webhook]
verify_jwt = false

[analytics]
enabled = false
port = 55437
