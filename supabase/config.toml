project_id = "supplyflow-p0"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 55433

[inbucket]
enabled = false
port = 55434

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5199"
# The quality gate chooses the first free port from the exact range below. Local GoTrue treats
# redirect ports as exact even though hosted preview-host globs are supported, so a wildcard port
# silently falls back to site_url. Production needs the mirror ({origin}/reset-password) in the
# remote project's Auth URL configuration (#114).
additional_redirect_urls = [
  "http://127.0.0.1:5199",
  "http://127.0.0.1:5199/reset-password",
  "http://127.0.0.1:5200/reset-password",
  "http://127.0.0.1:5201/reset-password",
  "http://127.0.0.1:5202/reset-password",
  "http://127.0.0.1:5203/reset-password",
  "http://127.0.0.1:5204/reset-password",
  "http://127.0.0.1:5205/reset-password",
  "http://127.0.0.1:5206/reset-password",
  "http://127.0.0.1:5207/reset-password",
  "http://127.0.0.1:5208/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55483

[functions.document-processing]
verify_jwt = false

# Browser JWTs are validated inside the handler; cron uses a separate narrow shared secret.
[functions.interpret-document]
verify_jwt = false

[functions.submit-price-list]
verify_jwt = true

[functions.send-push]
verify_jwt = false

# Cron-invoked via pg_net (0064 dispatcher); auth is the constant-time shared secret in
# x-outbox-cron-secret, not a JWT — the send-push precedent.
[functions.outbox-worker]
verify_jwt = false

[analytics]
enabled = false
port = 55437
