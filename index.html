<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Belt and braces behind public/_headers, which carries X-Robots-Tag: noindex on /*.
         The header is the one that matters for a single-page application; this tag is what a
         reader of the source sees, and what survives if the document is ever served from
         somewhere that does not read Cloudflare Pages headers. portal.html has carried this
         tag since it shipped; the tenant shell and the operator console had nothing. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The LIGHT ground. `appearance.ts` rewrites this at runtime by READING `--color-canvas`,
         precisely so the browser chrome cannot drift from the palette — and this line is the one
         place that still has to state the colour, because it is needed before any stylesheet has
         loaded. It is therefore written in the token's own notation and asserted against it by
         `scripts/check-appearance-scope.mjs`, rather than transcribed into a hex nobody would
         re-derive after a repaint. -->
    <meta name="theme-color" content="oklch(96.88% 0.0028 128)" />
    <!-- PRE-PAINT THEME, and it has to be inline and here.
         `data-theme` decides which palette `src/index.css` resolves. Setting it from a React effect
         works, but the effect runs after the first paint: a person who chose dark would watch a
         white page flash past on every cold start, on every navigation that reloads. Eleven lines
         of blocking script buys the absence of that flash.
         Wrapped in try/catch because a private window can throw on `localStorage` access alone, and
         a thrown bootstrap here would take the whole document with it. No storage, no attribute,
         light theme - which is the documented default anyway. -->
    <script>
      try {
        var t = localStorage.getItem('inplace.theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) { /* storage denied: the light default is already correct */ }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Icon order is the fallback chain: a browser that understands SVG stops at the first
         line and gets a vector mark at any density; older ones fall through to favicon.ico.
         The .ico must exist as a file regardless of these tags - public/_redirects ends with
         `/* /index.html 200`, so a bare /favicon.ico request was previously answered with an
         HTML document. Source is inplace-symbol.svg, byte-identical to what the marketing
         site serves, so both tabs show the same mark. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Both subsets, and the Latin one is not only for English readers: its unicode-range
         starts at U+0000-00FF, so it carries the DIGITS. Every price, quantity, date and
         invoice number on a Hebrew screen is drawn from this file, and until it was listed
         here the whole money column rendered in a fallback face and then reflowed. 19.7KB
         next to the Hebrew subset's 12KB, on the critical path for both languages. -->
    <link rel="preload" href="/fonts/noto/NotoSansHebrew-Hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/noto/NotoSansHebrew-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Product name only: the tenant is unknown until auth resolves, and AuthContext
         prefixes the organization name to this once it is. -->
    <title>InPlace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
