# The heavy gate — `npm run quality` — on CI instead of on one Windows machine.
#
# WHY THIS EXISTS. Between 23.07 and 09.08.2026 the gate ran 415 times on the owner's laptop
# and consumed 24.0 hours of it. 160 of those runs (39%) died without writing a single
# artifact, and only 80 (19%) reached PASS; on 09.08 alone, 149 of 180 runs died at zero.
# Almost none of that was a product regression: the failures were a port already bound, the
# dev server holding a DB connection into `deadlock detected (SQLSTATE 40P01)`, a second agent
# holding the QA mutex. Every one of those disappears on a runner that starts empty.
#
# WHAT IT COVERS. The same work the PowerShell gate does, from the same sources — the SQL
# suite list is PARSED OUT of check-quality-gates.ps1 at run time by scripts/ci-sql-suites.mjs,
# never copied, so CI and the manual gate cannot disagree about which suites run, in what
# order, or under which role. Six waves of numeric drift in this repo came from a second copy
# of a list; there is no second copy here.
#
# WHAT IT DOES NOT COVER, stated so nobody reads a green tick as more than it is:
#   * check-p0-security.ps1 and check-p0-upgrade.ps1 (862 + 88 lines of Windows PowerShell,
#     invoked as child processes) — these still run only in the manual gate.
#   * The P1B and OCR Edge smokes (Invoke-PriceListEdgeSmoke / Invoke-OcrEdgeSmoke).
#   * The P4 integrated journey (check-p4-integrated-journey.cjs).
# Those need the same Windows-coupled helpers and are the next thing to port.
#
# A small native path classifier starts only the relevant work. Edge contracts, the OCR image,
# dependency audit, SQL and browser scenarios have separate triggers; test-only frontend changes
# do not start the browser stack. Manual runs execute every area. Jobs that do run remain
# independent and parallel.

name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match supabase/config.toml — the gate refuses any project that is not this one.
  SUPABASE_PROJECT_ID: supplyflow-p0
  LOCAL_API_URL: http://127.0.0.1:55431
  # Pinned to the version the manual gate runs with, so a CLI release cannot silently change
  # migration behaviour between the two.
  SUPABASE_CLI_VERSION: 2.98.2

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.filter.outputs.edge }}
      ocr: ${{ steps.filter.outputs.ocr }}
      audit: ${{ steps.filter.outputs.audit }}
      sql: ${{ steps.filter.outputs.sql }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Select relevant heavy jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "edge=true" >> "$GITHUB_OUTPUT"
            echo "ocr=true" >> "$GITHUB_OUTPUT"
            echo "audit=true" >> "$GITHUB_OUTPUT"
            echo "sql=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --name-only "$base" "$HEAD_SHA" > changed-files.txt

          matches() { grep -Eq "$1" changed-files.txt; }
          grep -Ev '(^|/)[^/]+\.(spec|test)\.[cm]?[jt]sx?$' changed-files.txt > product-files.txt || true
          product_matches() { grep -Eq "$1" product-files.txt; }

          workflow='^\.github/workflows/quality-gate\.yml$'
          # src/lib/assistant/ is in the edge set on purpose: the assistant Edge function imports
          # src/lib/assistant/contracts.ts directly (one canonical contract, two runtimes), so a
          # contract change must re-run the Deno contracts even when no supabase/ path moved.
          # The whole directory is matched rather than the one file, so a second cross-runtime
          # import added later cannot silently fall outside the gate.
          edge='^(deno\.lock|src/lib/assistant/|supabase/(config\.toml|functions/))'
          ocr='^(docker-compose\.ocr\.yml|worker/ocr/)'
          audit='^(package\.json|package-lock\.json)$'
          sql='^(supabase/(config\.toml|migrations/|tests/|demo/|seed\.sql)|scripts/(check-quality-gates\.ps1|ci-sql-suites\.mjs|ci-local-env\.mjs|fixtures/.*\.sql))'
          browser='^(src/|public/|index\.html|operator\.html|portal\.html|vite\.config\.[cm]?[jt]s|package\.json|package-lock\.json|supabase/(config\.toml|demo/|seed\.sql)|scripts/(check-browser-smoke\.cjs|ci-sql-suites\.mjs|ci-local-env\.mjs|create-users\.ps1|fixtures/))'

          if matches "$workflow|$edge"; then echo "edge=true" >> "$GITHUB_OUTPUT"; else echo "edge=false" >> "$GITHUB_OUTPUT"; fi
          if matches "$workflow|$ocr"; then echo "ocr=true" >> "$GITHUB_OUTPUT"; else echo "ocr=false" >> "$GITHUB_OUTPUT"; fi
          if matches "$workflow|$audit"; then echo "audit=true" >> "$GITHUB_OUTPUT"; else echo "audit=false" >> "$GITHUB_OUTPUT"; fi
          if matches "$workflow|$sql"; then echo "sql=true" >> "$GITHUB_OUTPUT"; else echo "sql=false" >> "$GITHUB_OUTPUT"; fi
          browser_required=false
          if product_matches "$workflow|$browser"; then
            browser_required=true
          else
            # A DB-only change normally stops at the SQL gate. Permission migrations are the
            # exception: their product surface is the signed-in browser even when no src file
            # changed, so inspect only changed migration files for the trust-boundary vocabulary.
            # The file is read STATEMENT-BY-STATEMENT, not line-by-line: whitespace (newlines
            # included) is collapsed and the text split on ';', so a grant/revoke wrapped across
            # lines by a long signature reads the same as an unwrapped one. Measured before this
            # granularity fix: 0166 revokes browser roles across three wrapped lines and produced
            # ZERO line-based matches — the exact statement this sniffer exists to catch.
            while IFS= read -r migration; do
              [ -f "$migration" ] || continue
              if tr -s '[:space:]' ' ' < "$migration" | tr ';' '\n' | grep -Eqi \
                '(create|alter|drop)[[:space:]]+policy|row[[:space:]]+level[[:space:]]+security|user_role|auth_(role|org|scopes)[[:space:]]*\(|(grant|revoke).*(authenticated|anon)'; then
                browser_required=true
                break
              fi
            done < <(grep -E '^supabase/migrations/.*\.sql$' changed-files.txt || true)
          fi
          echo "browser=$browser_required" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- contracts (no database)
  contracts:
    needs: changes
    if: needs.changes.outputs.edge == 'true' || needs.changes.outputs.ocr == 'true'
    name: Deno contracts + OCR worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.edge == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Recovery function keeps platform JWT verification enabled
        if: needs.changes.outputs.edge == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const lines = readFileSync('supabase/config.toml', 'utf8').split(/\r?\n/);
          let section = '';
          const values = [];
          for (const line of lines) {
            const header = line.match(/^\s*\[([^\]]+)]\s*(?:#.*)?$/);
            if (header) {
              section = header[1];
              continue;
            }
            if (section !== 'functions.recover-document-processing') continue;
            const assignment = line.match(/^\s*verify_jwt\s*=\s*(true|false)\s*(?:#.*)?$/i);
            if (assignment) values.push(assignment[1].toLowerCase() === 'true');
          }
          if (values.length !== 1 || values[0] !== true) {
            throw new Error(
              '[functions.recover-document-processing] must declare exactly one verify_jwt = true',
            );
          }
          NODE

      - name: Interpret-document prompt, provider-failure and authorization contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          npx --yes deno test \
            --config supabase/functions/interpret-document/deno.json \
            supabase/functions/interpret-document/core.test.ts \
            supabase/functions/interpret-document/split.test.ts \
            supabase/functions/interpret-document/authorization.test.ts 2>&1 | tee deno-interpret.log
          # The gate does not accept a run that asserted nothing, or that skipped a case.
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-interpret.log \
            || { echo 'No completed test reported.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-interpret.log \
            || { echo 'Ignored or skipped cases are not acceptable in this gate.'; exit 1; }

      - name: Price-list intake authorization and type contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          PRICE_ROOT=supabase/functions/submit-price-list
          npx --yes deno test \
            --config "$PRICE_ROOT/deno.json" \
            --lock "$PRICE_ROOT/deno.lock" \
            --frozen \
            "$PRICE_ROOT/authorization.test.ts" 2>&1 | tee deno-price-list.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-price-list.log \
            || { echo 'No price-list authorization test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-price-list.log \
            || { echo 'Ignored or skipped price-list cases are not acceptable.'; exit 1; }
          npx --yes deno check \
            --allow-import \
            --node-modules-dir=auto \
            --config "$PRICE_ROOT/deno.json" \
            --lock "$PRICE_ROOT/deno.lock" \
            --frozen \
            "$PRICE_ROOT/index.ts"

      - name: Document gateway and organization-boundary contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          npx --yes deno test \
            --config supabase/functions/document-processing/deno.json \
            supabase/functions/document-processing/contract_test.ts 2>&1 | tee deno-document-gateway.log
          npx --yes deno test \
            --config supabase/functions/interpret-document/deno.json \
            --allow-read=. \
            supabase/functions/_shared/organization-access.test.ts \
            supabase/functions/_shared/organization-egress.test.ts \
            supabase/functions/_shared/reserved-egress.test.ts \
            supabase/functions/_shared/edge-organization-access-wiring.test.ts \
            supabase/functions/_shared/provision.test.ts 2>&1 | tee deno-organization-boundaries.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-document-gateway.log \
            || { echo 'No document-gateway test completed.'; exit 1; }
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-organization-boundaries.log \
            || { echo 'No organization-boundary test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-document-gateway.log deno-organization-boundaries.log \
            || { echo 'Ignored or skipped cases are not acceptable in this gate.'; exit 1; }

      - name: Document-processing function type contract
        if: needs.changes.outputs.edge == 'true'
        working-directory: supabase/functions/document-processing
        run: npx --yes deno check --config deno.json --lock deno.lock --frozen index.ts

      - name: Supplier-portal token-door contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          npx --yes deno test \
            supabase/functions/supplier-portal/core.test.ts 2>&1 | tee deno-supplier-portal.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-supplier-portal.log \
            || { echo 'No supplier-portal test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-supplier-portal.log \
            || { echo 'Ignored or skipped supplier-portal cases are not acceptable.'; exit 1; }

      - name: Email order-delivery template contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          npx --yes deno test \
            supabase/functions/email-sender/templates.test.ts 2>&1 | tee deno-email-sender.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-email-sender.log \
            || { echo 'No email-sender test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-email-sender.log \
            || { echo 'Ignored or skipped email-sender cases are not acceptable.'; exit 1; }

      - name: Document preprocessing contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          SCAN_ROOT=supabase/functions/document-preprocessing
          npx --yes deno test --config "$SCAN_ROOT/deno.json" \
            "$SCAN_ROOT/contract_test.ts" 2>&1 | tee deno-document-scan.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-document-scan.log \
            || { echo 'No document-scan contract completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-document-scan.log \
            || { echo 'Ignored or skipped scan cases are not acceptable.'; exit 1; }
          npx --yes deno check --config "$SCAN_ROOT/deno.json" "$SCAN_ROOT/index.ts"

      - name: Stuck document-processing recovery contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          RECOVERY_ROOT=supabase/functions/recover-document-processing
          npx --yes deno test \
            --config "$RECOVERY_ROOT/deno.json" \
            --lock "$RECOVERY_ROOT/deno.lock" \
            --frozen \
            --allow-read="$RECOVERY_ROOT" \
            "$RECOVERY_ROOT/contract_test.ts" 2>&1 | tee deno-document-recovery.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-document-recovery.log \
            || { echo 'No document-recovery test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-document-recovery.log \
            || { echo 'Ignored or skipped recovery cases are not acceptable.'; exit 1; }
          npx --yes deno check \
            --config "$RECOVERY_ROOT/deno.json" \
            --lock "$RECOVERY_ROOT/deno.lock" \
            --frozen \
            "$RECOVERY_ROOT/index.ts"

      - name: Send-feedback function type contract
        if: needs.changes.outputs.edge == 'true'
        working-directory: supabase/functions/send-feedback
        run: npx --yes deno check --config deno.json --lock deno.lock --frozen index.ts

      - name: Send-invite function type contract
        if: needs.changes.outputs.edge == 'true'
        working-directory: supabase/functions/send-invite
        run: npx --yes deno check --config deno.json --lock deno.lock --frozen index.ts

      - name: Outbox-worker delivery, header and signature contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          npx --yes deno test \
            --config supabase/functions/outbox-worker/deno.json \
            supabase/functions/outbox-worker/*.test.ts 2>&1 | tee deno-outbox.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-outbox.log \
            || { echo 'No completed test reported.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-outbox.log \
            || { echo 'Ignored or skipped cases are not acceptable in this gate.'; exit 1; }

      - name: Assistant authorization, egress, validation, tool and provider contracts
        if: needs.changes.outputs.edge == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar
          ASSISTANT_ROOT=supabase/functions/assistant
          # The RECURSIVE glob, not a hand-kept list: a new *.test.ts anywhere under the function
          # directory — subdirectories like tools/ included — is gated the moment it exists,
          # instead of shipping silently until someone edits this file. A single-level glob here
          # once hid the two tools/ suites while the gate stayed green.
          # --allow-env covers handler.test.ts and is granted to the whole invocation on purpose:
          # splitting the glob into per-permission lists would reintroduce the hand-kept list.
          npx --yes deno test \
            --config "$ASSISTANT_ROOT/deno.json" \
            --lock "$ASSISTANT_ROOT/deno.lock" \
            --frozen \
            --allow-env \
            "$ASSISTANT_ROOT"/**/*.test.ts 2>&1 | tee deno-assistant.log
          grep -Eq '\b[1-9][0-9]*\s+passed\b' deno-assistant.log \
            || { echo 'No assistant contract test completed.'; exit 1; }
          ! grep -Eqi '\b[1-9][0-9]*\s+(ignored|skipped)\b' deno-assistant.log \
            || { echo 'Ignored or skipped assistant cases are not acceptable.'; exit 1; }
          npx --yes deno check \
            --allow-import \
            --node-modules-dir=auto \
            --config "$ASSISTANT_ROOT/deno.json" \
            --lock "$ASSISTANT_ROOT/deno.lock" \
            --frozen \
            "$ASSISTANT_ROOT/index.ts"
      - name: OCR worker Compose validation
        if: needs.changes.outputs.ocr == 'true'
        run: docker compose -f docker-compose.ocr.yml config --quiet

      - name: OCR worker image build
        if: needs.changes.outputs.ocr == 'true'
        run: docker build --pull=false -t supplyflow-ocr-worker:acceptance worker/ocr

      - name: OCR worker no-GPU / no-model self-check
        if: needs.changes.outputs.ocr == 'true'
        run: docker run --rm --network none --entrypoint python supplyflow-ocr-worker:acceptance /app/self_check.py

      - name: Document scanner unit tests
        if: needs.changes.outputs.ocr == 'true'
        run: docker run --rm --network none --entrypoint python supplyflow-ocr-worker:acceptance -m unittest -v test_scanning.py test_scan_gateway.py

  # --------------------------------------------------------- dependency advisory boundary
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: High-severity production dependency audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------- the SQL suites + the preflight
  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    name: SQL suites + preflight (parsed from the gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Write the local Edge environment
        run: node scripts/ci-local-env.mjs write-functions-env

      - name: Start the isolated local stack (runs all migrations + seed)
        run: supabase start

      - name: Sanity — the gate's container is the one we will talk to
        run: docker ps --format '{{.Names}}' | grep -qx "supabase_db_${SUPABASE_PROJECT_ID}"

      - name: The suites, in the order check-quality-gates.ps1 declares them
        run: node scripts/ci-sql-suites.mjs

      # psql reports "server closed the connection unexpectedly" and every later suite then
      # fails with "the database system is in recovery mode" -- one backend crash reads as a
      # wall of unrelated failures. The reason is in the postmaster log, which nothing printed,
      # so the only evidence was whichever suite happened to be running. Failure only.
      - name: The postmaster log, if a backend died
        if: failure()
        run: |
          docker logs "supabase_db_${SUPABASE_PROJECT_ID}" 2>&1 \
            | grep -iE -B 3 -A 25 "was terminated by signal|PANIC|server process|out of memory|startup process|stack depth|recovery mode" \
            | tail -300 || echo "no crash markers in the postmaster log"

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true

  # ---------------------------------------------------------- the browser scenarios
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Browser, keyboard, print and a11y scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Write the local Edge environment
        run: node scripts/ci-local-env.mjs write-functions-env

      - name: Start the isolated local stack
        run: supabase start

      - name: Export the stack's keys for the build and the fixtures
        run: |
          set -euo pipefail
          # `supabase status -o env` also prints a "Stopped services: [...]" line and a CLI
          # update notice. Only real KEY=value lines may reach $GITHUB_ENV — anything else
          # corrupts the file for every later step.
          supabase status -o env | sed 's/"//g' | grep -E '^[A-Z][A-Z0-9_]*=' > stack.env
          test -s stack.env
          # Per-run keys for an ephemeral local stack, but masked anyway: a log is forever.
          while IFS='=' read -r key value; do
            case "$key" in *KEY|*SECRET|JWT_SECRET) [ -n "$value" ] && echo "::add-mask::$value" ;; esac
            echo "$key=$value" >> "$GITHUB_ENV"
          done < stack.env
          grep -c . stack.env | xargs -I{} echo 'Exported {} stack variables.'
          rm -f stack.env

      - name: Build the bundle the scenarios will actually exercise
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}

      - name: Demo Auth users, seeded and verified
        run: |
          set -euo pipefail
          SEED="$(node -e 'process.stdout.write(require("crypto").randomUUID().replace(/-/g,""))')"
          echo "::add-mask::$SEED"
          echo "QUALITY_PASSWORD_SEED=$SEED" >> "$GITHUB_ENV"
          node scripts/ci-local-env.mjs write-demo-manifest "$SEED" "$RUNNER_TEMP/demo-users.json"
          pwsh -NoProfile -File scripts/create-users.ps1 \
            -ProjectUrl "$LOCAL_API_URL" -CredentialsPath "$RUNNER_TEMP/demo-users.json"
          node scripts/ci-sql-suites.mjs --file supabase/demo/demo_seed.sql
        env:
          SUPABASE_SERVICE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Verify the fixture has no cross-tenant rows
        run: |
          set -euo pipefail
          docker cp supabase/demo/demo_verify.sql "supabase_db_${SUPABASE_PROJECT_ID}:/tmp/demo_verify.sql"
          docker exec -e PGPASSWORD=postgres "supabase_db_${SUPABASE_PROJECT_ID}" \
            psql -qAt -F '|' -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/demo_verify.sql > verify.out
          cat verify.out
          rows=$(grep -cE '^[BC]\.' verify.out || true)
          [ "$rows" -gt 0 ] || { echo 'Demo verification returned no integrity rows.'; exit 1; }
          bad=$(awk -F'|' '/^[BC]\./ && $NF != 0' verify.out || true)
          [ -z "$bad" ] || { echo "Demo fixture contains cross-tenant rows: $bad"; exit 1; }
          echo "Demo fixture verification passed: $rows tenant-integrity checks returned 0."

      - name: OCR browser Storage fixture
        run: |
          set -euo pipefail
          node scripts/fixtures/ocr/prepare-browser-fixture.cjs
          node scripts/ci-sql-suites.mjs --file scripts/fixtures/ocr/browser-fixture.sql
        env:
          OCR_ACCEPTANCE_API_URL: ${{ env.API_URL }}
          OCR_ACCEPTANCE_ANON_KEY: ${{ env.ANON_KEY }}
          OCR_ACCEPTANCE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          OCR_ACCEPTANCE_PASSWORD_SEED: ${{ env.QUALITY_PASSWORD_SEED }}

      - name: Locate a Chromium the scenarios can drive
        run: |
          set -euo pipefail
          # playwright-core ships no browser by design (the local gate drives installed Chrome
          # or Edge). Prefer whatever the runner image already has; install only if it does not.
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "QUALITY_BROWSER_PATH=$candidate" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          npx --yes playwright install --with-deps chromium
          resolved="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          test -x "$resolved"
          echo "QUALITY_BROWSER_PATH=$resolved" >> "$GITHUB_ENV"
          "$resolved" --version

      - name: Serve the built bundle on the allow-listed port
        run: |
          set -euo pipefail
          # 5199 is not a preference: it is the redirect GoTrue is configured to accept, so a
          # different port would silently test a redirect the real Auth would replace.
          npx vite preview --host 127.0.0.1 --port 5199 --strictPort &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5199/login >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo 'vite preview never served /login'; exit 1

      - name: Browser scenarios
        run: node scripts/check-browser-smoke.cjs
        env:
          QUALITY_BASE_URL: http://127.0.0.1:5199
          QUALITY_API_URL: ${{ env.API_URL }}
          QUALITY_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          QUALITY_ARTIFACT_DIR: ${{ runner.temp }}/browser-evidence
          QUALITY_PASSWORD_SEED: ${{ env.QUALITY_PASSWORD_SEED }}
          QUALITY_BROWSER_PATH: ${{ env.QUALITY_BROWSER_PATH }}
          PLAYWRIGHT_CORE_PATH: ${{ github.workspace }}/node_modules/playwright-core
          QUALITY_REQUIRE_ALL: '1'

      - name: Keep the evidence — screenshots, the PDF and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true
