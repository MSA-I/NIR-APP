# Fast CI. Build and verification are separate jobs so an ordinary bundle build is no longer a
# hidden test runner, and both independent halves execute in parallel. Docker, live Supabase,
# Deno and browser integration remain in quality-gate.yml.
#
# The xlsx dependency installs from cdn.sheetjs.com (a tarball URL in package.json, pinned
# by integrity hash in package-lock.json). setup-node's npm cache keeps the tarball out of
# most runs; if the CDN ever blocks CI, fix at the INSTALL level (cache/vendor the tarball)
# — never by swapping the package version without an owner decision.
name: build-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci — lockfile is the contract)
        run: npm ci

      - name: Typecheck and production bundle
        run: npm run build
        # The browser client intentionally fails at module load when its public Vite
        # configuration is absent. CI does not deploy this bundle, so use explicit,
        # non-secret placeholders; production values never belong in GitHub logs.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-placeholder

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (npm ci — lockfile is the contract)
        run: npm ci
      - name: Static guards and Vitest
        run: npm run verify
