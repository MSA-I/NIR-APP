# Fast CI. Build and verification are separate jobs so an ordinary bundle build is no longer a
# hidden test runner, and both independent halves execute in parallel. Docker, live Supabase,
# Deno and browser integration remain in quality-gate.yml.
#
# Every change still creates the named build/verify checks required by branch protection, but each
# job is skipped before a runner is allocated unless one of its own inputs changed. Production
# bundle inputs run `build`; code, tests, static guards and Knip inputs run `verify`. SQL suites,
# Edge functions and OCR worker files no longer build a browser bundle merely because they are not
# Markdown. Test-only changes run `verify` without the redundant production build.
#
# The xlsx dependency installs from cdn.sheetjs.com (a tarball URL in package.json, pinned
# by integrity hash in package-lock.json). setup-node's npm cache keeps the tarball out of
# most runs; if the CDN ever blocks CI, fix at the INSTALL level (cache/vendor the tarball)
# — never by swapping the package version without an owner decision.
name: build-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify fast-gate inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      verify: ${{ steps.filter.outputs.verify }}
      install: ${{ steps.filter.outputs.install }}
      knip: ${{ steps.filter.outputs.knip }}
      tokens: ${{ steps.filter.outputs.tokens }}
      money: ${{ steps.filter.outputs.money }}
      exemptions: ${{ steps.filter.outputs.exemptions }}
      suitemanifest: ${{ steps.filter.outputs.suitemanifest }}
      mignumbers: ${{ steps.filter.outputs.mignumbers }}
      closure: ${{ steps.filter.outputs.closure }}
      gatecontrols: ${{ steps.filter.outputs.gatecontrols }}
      supplier: ${{ steps.filter.outputs.supplier }}
      nosend: ${{ steps.filter.outputs.nosend }}
      vitest: ${{ steps.filter.outputs.vitest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Select build and verification jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --name-only "$base" "$HEAD_SHA" > changed-files.txt

          # A test file can require Vitest/Knip without changing the production bundle.
          grep -Ev '(^|/)[^/]+\.(spec|test)\.[cm]?[jt]sx?$' changed-files.txt > product-files.txt || true

          matches() { grep -Eq "$1" changed-files.txt; }
          product_matches() { grep -Eq "$1" product-files.txt; }

          build_common='^(\.github/workflows/build\.yml|package\.json|package-lock\.json|tsconfig[^/]*\.json|vite\.config\.[cm]?[jt]s)$'
          build_inputs='^(src/|public/|index\.html$|operator\.html$|portal\.html$)'
          workflow='^\.github/workflows/build\.yml$'
          knip_config='^(package\.json|package-lock\.json|knip\.json|tsconfig[^/]*\.json|vite\.config\.[cm]?[jt]s)$'
          vitest_config='^(package\.json|package-lock\.json|tsconfig[^/]*\.json|vite\.config\.[cm]?[jt]s|vitest\.config\.[cm]?[jt]s)$'
          knip_inputs='^(src/|scripts/|supabase/functions/|knip\.json$)'
          token_inputs='^(src/|scripts/check-design-tokens\.ts$)'
          money_inputs='^(src/|scripts/check-money\.ts$)'
          exemption_inputs='^(supabase/migrations/|scripts/check-exemption-pin\.ts$)'
          supplier_inputs='^(src/|scripts/check-supplier-columns\.ts$)'
          # The assistant surface, tests included: the no-send guard reads spec files too (an
          # egress kind or a foreign flag key counts wherever it is written).
          nosend_inputs='^(src/lib/assistant/|src/components/assistant/|src/components/AssistantPanel\.tsx$|supabase/functions/assistant/|scripts/check-assistant-no-send\.mjs$)'
          vitest_inputs='^(src/|.*\.(spec|test)\.[cm]?[jt]sx?$)'
          # The merge guards. `migrations` covers number collisions and new gaps; `closure`
          # additionally watches every surface that can cite a migration by filename, because a
          # half-finished renumber leaves the pointer behind rather than the file.
          gate_registry='^(scripts/check-quality-gates\.ps1|scripts/suite-manifest\.baseline\.json|scripts/check-suite-manifest\.mjs)$'
          migration_number_inputs='^(supabase/migrations/|scripts/check-migration-numbers\.mjs$)'
          closure_inputs='^(supabase/migrations/|supabase/tests/|supabase/functions/|docs/|scripts/|src/)'
          gate_control_inputs='^scripts/check-(suite-manifest|migration-numbers|renumber-closure|gate-controls)\.mjs$'

          if [ ! -s changed-files.txt ] || product_matches "$build_common|$build_inputs"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$knip_config|$vitest_config|$knip_inputs|$token_inputs|$money_inputs|$exemption_inputs|$supplier_inputs|$nosend_inputs|$vitest_inputs|$gate_registry|$migration_number_inputs|$closure_inputs|$gate_control_inputs"; then echo "verify=true" >> "$GITHUB_OUTPUT"; else echo "verify=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$knip_config|$vitest_config|$knip_inputs|$vitest_inputs"; then echo "install=true" >> "$GITHUB_OUTPUT"; else echo "install=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$knip_config|$knip_inputs"; then echo "knip=true" >> "$GITHUB_OUTPUT"; else echo "knip=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|scripts/check-design-tokens\.ts$" || product_matches '^src/'; then echo "tokens=true" >> "$GITHUB_OUTPUT"; else echo "tokens=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|scripts/check-money\.ts$" || product_matches '^src/'; then echo "money=true" >> "$GITHUB_OUTPUT"; else echo "money=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$exemption_inputs"; then echo "exemptions=true" >> "$GITHUB_OUTPUT"; else echo "exemptions=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$gate_registry"; then echo "suitemanifest=true" >> "$GITHUB_OUTPUT"; else echo "suitemanifest=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$migration_number_inputs"; then echo "mignumbers=true" >> "$GITHUB_OUTPUT"; else echo "mignumbers=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$closure_inputs"; then echo "closure=true" >> "$GITHUB_OUTPUT"; else echo "closure=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$gate_control_inputs"; then echo "gatecontrols=true" >> "$GITHUB_OUTPUT"; else echo "gatecontrols=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|scripts/check-supplier-columns\.ts$" || product_matches '^src/'; then echo "supplier=true" >> "$GITHUB_OUTPUT"; else echo "supplier=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$nosend_inputs"; then echo "nosend=true" >> "$GITHUB_OUTPUT"; else echo "nosend=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s changed-files.txt ] || matches "$workflow|$vitest_config|$vitest_inputs"; then echo "vitest=true" >> "$GITHUB_OUTPUT"; else echo "vitest=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci — lockfile is the contract)
        run: npm ci

      - name: Typecheck and production bundle
        run: npm run build
        # The browser client intentionally fails at module load when its public Vite
        # configuration is absent. CI does not deploy this bundle, so use explicit,
        # non-secret placeholders; production values never belong in GitHub logs.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-placeholder

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.install == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.install != 'true'
        with:
          node-version: 24
      - name: Install (npm ci — lockfile is the contract)
        if: needs.changes.outputs.install == 'true'
        run: npm ci
      - name: Dead-code and dependency graph
        if: needs.changes.outputs.knip == 'true'
        run: npm run check:dead-code
      - name: Design-token guard
        if: needs.changes.outputs.tokens == 'true'
        run: npm run check:tokens
      - name: Money-format guard
        if: needs.changes.outputs.money == 'true'
        run: npm run check:money
      - name: SECURITY DEFINER exemption guard
        if: needs.changes.outputs.exemptions == 'true'
        run: npm run check:exemptions
      - name: Supplier-column guard
        if: needs.changes.outputs.supplier == 'true'
        run: npm run check:supplier-columns
      - name: Assistant no-send guard
        if: needs.changes.outputs.nosend == 'true'
        run: npm run check:assistant-no-send
      - name: Suite-manifest guard (a dropped SQL suite leaves CI silently)
        if: needs.changes.outputs.suitemanifest == 'true'
        run: npm run check:suite-manifest
      - name: Migration-number guard (no duplicate, no new gap)
        if: needs.changes.outputs.mignumbers == 'true'
        run: npm run check:migration-numbers
      - name: Renumber-closure guard (the number lives in the body, not the filename)
        if: needs.changes.outputs.closure == 'true'
        run: npm run check:renumber-closure
      - name: Gate controls (each guard must fail on a broken input)
        # Runs whenever ANY guard it validates runs. Relying on a guard's verdict without
        # proof that the guard still fails correctly is how a guard becomes decoration —
        # and a baseline edit alone can defeat one, which is why this is not gated on the
        # guard sources changing.
        if: >-
          needs.changes.outputs.gatecontrols == 'true' ||
          needs.changes.outputs.suitemanifest == 'true' ||
          needs.changes.outputs.mignumbers == 'true' ||
          needs.changes.outputs.closure == 'true'
        run: npm run check:gate-controls
      - name: Vitest
        if: needs.changes.outputs.vitest == 'true'
        run: npm run test
