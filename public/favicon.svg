<svg xmlns="http://www.w3.org/2000/svg" viewBox="1659.8087799072266 677.8427764892579 156.29247436523437 156.29247436523437" role="img" aria-labelledby="title desc">
  <title id="title">InPlace symbol</title>
  <desc id="desc">InPlace standalone symbol in one ink. Follows the operating system's colour scheme,
    because a browser tab is not part of the application and cannot see its theme.</desc>
  <!-- ONE INK (owner ruling #4, 31.08.2026): the mark used to carry two different darks inside it,
       which read as a seam at small sizes. It is now a single onyx, matching the ink the product
       writes its headings in.

       THE MEDIA QUERY IS NOT THE APP'S THEME, and the difference matters. This file is served to
       the browser tab, to bookmarks and to installed-app surfaces — none of which can see
       `data-theme` on our document. So it follows the OPERATING SYSTEM, which is the only signal
       available there, and the in-page marks are handled separately by `<BrandMark>`. A person who
       chooses dark inside the product while their OS stays light gets a dark mark in the tab, and
       that is correct: the tab strip is light. -->
  <style>
    path { fill: #0A171D; }
    @media (prefers-color-scheme: dark) { path { fill: #FBFBFB; } }
  </style>
